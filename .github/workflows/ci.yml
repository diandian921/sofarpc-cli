name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build + vet + test (${{ matrix.os }})
    # Test every advertised desktop platform for real. Windows owns installer,
    # locking, and executable-replacement paths that cross-compilation cannot cover.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # Key the module cache on both go.sum files so the oracletest
          # submodule's dependencies participate in cache invalidation.
          cache-dependency-path: |
            go.sum
            oracletest/go.sum
      - name: gofmt
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi
      - name: Build
        run: go build ./...
      # The project ships a Windows installer (scripts/install.ps1); keep the
      # Windows target compiling. Pure-Go, so a cross-compile is enough.
      - name: Build (windows/amd64)
        shell: bash
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: PowerShell installer smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/install.ps1 -h
      - name: Vet
        run: go vet ./...
      # Pure-Go suite. The JVM compatibility oracle (-tags hessian_oracle) is
      # intentionally excluded here: it needs a JVM and the internal alipay
      # Hessian jar, so it runs as a local pre-release gate (see README "Test").
      - name: Test
        run: go test -race ./...
      # The BOLT oracle checks the hand-written BOLT framing against the
      # official sofa-bolt-go library. Pure Go, isolated in its own module so
      # the sofa-bolt-go tree stays out of the main go.mod.
      - name: Vet (oracletest)
        run: go vet -tags bolt_oracle ./...
        working-directory: oracletest
      - name: BOLT codec oracle (sofa-bolt-go)
        run: go test -race -tags bolt_oracle ./...
        working-directory: oracletest
      - name: Windows archive layout
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          VERSION=v0.0.0-test PLATFORMS=windows/amd64 bash scripts/package.sh
          unzip -Z1 dist/sofarpc-v0.0.0-test-windows-amd64.zip | \
            grep -qx 'sofarpc-v0.0.0-test-windows-amd64/sofarpc.exe'
