name: Release

# Tag-triggered release automation: the install scripts (scripts/install.{sh,ps1})
# download archives + SHA256SUMS from GitHub Releases, so asset naming and sums
# must be produced by the same scripts every time — no manual uploads.
#
# The JVM Hessian oracle cannot run here (internal alipay jar); run the full
# local gate (scripts/oracle-gate.sh) before pushing a release tag. CI-side the
# BOLT oracle still guards the codec.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep full history for generated release notes and tag verification.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release SemVer
        id: version
        shell: bash
        run: |
          source scripts/semver.sh
          tag="${GITHUB_REF_NAME}"
          if ! is_release_tag "$tag"; then
            echo "release tag must be strict SemVer with a v prefix, got: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          prerelease=false
          if semver_is_prerelease "$version"; then
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Gate — gofmt + vet + pure-Go suite + BOLT oracle
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt required for:"; echo "$files"; exit 1
          fi
          go vet ./...
          go test -race ./...
          go -C oracletest vet -tags bolt_oracle ./...
          go -C oracletest test -race -tags bolt_oracle ./...
      - name: Package release archives
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: bash scripts/package.sh
      - name: Build MCPB bundles
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          MCPB_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-mcpb.sh
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes "${args[@]}" \
            dist/sofarpc-*.tar.gz dist/sofarpc-*.zip dist/SHA256SUMS dist/mcpb/*.mcpb
